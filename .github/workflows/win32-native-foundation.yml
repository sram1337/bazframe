permissions:
  contents: read
  actions: read

env:
  BAZFRAME_RUST_TOOLCHAIN: 1.88.0
  BAZFRAME_MSVC_TOOLS_VERSION: 14.44.35207
  BAZFRAME_WIN32_NATIVE_PACK_MODE: foundation-evidence
  QUALIFICATION_REPOSITORY_ID: ${{ github.repository_id }}
  # Transport head identity is distinct from github.sha (the PR merge/source checkout).
  QUALIFICATION_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  QUALIFICATION_HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id || github.repository_id }}

jobs:
  foundation:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    outputs:
      artifact_id: ${{ steps.upload-input.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-input.outputs.artifact-digest }}
      source_commit: ${{ steps.binding.outputs.source_commit }}
      binary_sha256: ${{ steps.binding.outputs.binary_sha256 }}
      tarball_sha256: ${{ steps.binding.outputs.tarball_sha256 }}
      npm_version: ${{ steps.binding.outputs.npm_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check exact clean source before setup
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Git revision inspection failed.' }
          $state = & git status --porcelain=v1 --untracked-files=all
          if ($LASTEXITCODE -ne 0) { throw 'Git cleanliness inspection failed.' }
          if ($commit -cne $env:GITHUB_SHA -or -not [string]::IsNullOrWhiteSpace(($state -join "`n"))) {
            throw 'Qualification source changed or is not clean.'
          }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Pin Rust toolchain and Windows target
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install $env:BAZFRAME_RUST_TOOLCHAIN --profile minimal --component rustfmt --no-self-update
          if ($LASTEXITCODE -ne 0) { throw "rustup toolchain install failed with exit $LASTEXITCODE" }
          rustup target add x86_64-pc-windows-msvc --toolchain $env:BAZFRAME_RUST_TOOLCHAIN
          if ($LASTEXITCODE -ne 0) { throw "rustup target add failed with exit $LASTEXITCODE" }
          rustc +$env:BAZFRAME_RUST_TOOLCHAIN --version --verbose | Tee-Object native-rust-version.txt
          if ($LASTEXITCODE -ne 0) { throw "rustc version inspection failed with exit $LASTEXITCODE" }

      - name: Format, check, and build with the pinned MSVC toolset
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'bazframe-native-cargo'
          if (Test-Path -LiteralPath $env:CARGO_TARGET_DIR) {
            Remove-Item -LiteralPath $env:CARGO_TARGET_DIR -Recurse -Force
          }
          New-Item -ItemType Directory -Path $env:CARGO_TARGET_DIR | Out-Null
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0) { throw "vswhere failed with exit $LASTEXITCODE" }
          if ([string]::IsNullOrWhiteSpace($install)) { throw 'Visual Studio C++ build tools are unavailable.' }
          $toolRoot = Join-Path $install "VC\Tools\MSVC\$env:BAZFRAME_MSVC_TOOLS_VERSION"
          if (-not (Test-Path $toolRoot)) { throw "Pinned MSVC tools are unavailable: $env:BAZFRAME_MSVC_TOOLS_VERSION" }
          Import-Module (Join-Path $install 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $install -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64 -vcvars_ver=14.44"
          $compiler = (Get-Command cl.exe).Source
          if (-not $compiler.StartsWith($toolRoot, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Selected MSVC compiler is outside the pinned toolset: $compiler"
          }
          $compilerInfo = (Get-Item $compiler).VersionInfo
          @(
            "Path=$compiler"
            "FileVersion=$($compilerInfo.FileVersion)"
            "ProductVersion=$($compilerInfo.ProductVersion)"
          ) | Set-Content native-msvc-version.txt
          cargo +$env:BAZFRAME_RUST_TOOLCHAIN fmt --manifest-path native/win32/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { throw "cargo fmt failed with exit $LASTEXITCODE" }
          cargo +$env:BAZFRAME_RUST_TOOLCHAIN check --locked --manifest-path native/win32/Cargo.toml --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "cargo check failed with exit $LASTEXITCODE" }
          cargo +$env:BAZFRAME_RUST_TOOLCHAIN test --locked --manifest-path native/win32/Cargo.toml --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "cargo test failed with exit $LASTEXITCODE" }
          cargo +$env:BAZFRAME_RUST_TOOLCHAIN build --locked --release --manifest-path native/win32/Cargo.toml --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed with exit $LASTEXITCODE" }
          New-Item -ItemType Directory -Force artifacts/native/win32-x64-msvc | Out-Null
          Copy-Item (Join-Path $env:CARGO_TARGET_DIR 'x86_64-pc-windows-msvc\release\bazframe_win32_native.dll') artifacts/native/win32-x64-msvc/bazframe-win32.node
          (Get-FileHash artifacts/native/win32-x64-msvc/bazframe-win32.node -Algorithm SHA256).Hash.ToLowerInvariant() |
            Set-Content native-binary.sha256

      - name: Build TypeScript and run platform-neutral native contract tests
        run: |
          $ErrorActionPreference = 'Stop'
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "npm build failed with exit $LASTEXITCODE" }
          npx vitest run --config vitest.config.ts test/unit/core/win32-native.test.ts test/unit/state/win32-private-directory.test.ts test/unit/state/win32-directory-closure.test.ts test/unit/state/win32-directory-publication.test.ts test/unit/state/win32-operation-lock.test.ts test/unit/state/win32-skill-membership.test.ts test/unit/skills/added-skill-platform-services.test.ts test/unit/skills/added-skill-product-lifecycle.test.ts test/unit/scripts/win32-added-skill-evidence.test.ts test/unit/scripts/win32-qualification.test.ts test/unit/profiles/win32-profile-provisioning.test.ts test/unit/profiles/win32-profile-selection.test.ts test/unit/state/win32-atomic-file.test.ts test/unit/profile-publishing/win32-profile-activation.test.ts test/unit/cli/platform-support.test.ts
          if ($LASTEXITCODE -ne 0) { throw "native contract tests failed with exit $LASTEXITCODE" }

      - name: Admit independent private conformance roots
        run: |
          $ErrorActionPreference = 'Stop'
          $testParent = $env:LOCALAPPDATA
          $drive = (Get-Item $testParent).PSDrive.Name
          $disk = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='$($drive):'"
          if ($null -eq $disk -or $disk.DriveType -ne 3 -or $disk.FileSystem -ne 'NTFS') {
            throw 'The private conformance parent is not on a fixed local NTFS volume.'
          }
          $env:BAZFRAME_WIN32_NATIVE_TEST_PARENT = $testParent
          "BAZFRAME_WIN32_NATIVE_TEST_PARENT=$testParent" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Pack and install once, then qualify foundations sequentially offline
        id: binding
        run: |
          $ErrorActionPreference = 'Stop'
          $npmVersion = (npm --version).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'npm version inspection failed.' }
          $pack = npm pack --ignore-scripts --json --silent | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $pack.Count -ne 1) { throw 'Expected exactly one successful Bazframe pack.' }
          $tarball = Join-Path $PWD $pack[0].filename
          $tarballHash = (Get-FileHash $tarball -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedHash = (Get-Content native-binary.sha256 -Raw).Trim()
          $installRoot = Join-Path $env:RUNNER_TEMP 'bazframe-native-packed-install'
          New-Item -ItemType Directory $installRoot | Out-Null
          npm install --prefix $installRoot --ignore-scripts --no-package-lock $tarball
          if ($LASTEXITCODE -ne 0) { throw 'Packed npm install failed.' }
          $installed = Join-Path $installRoot 'node_modules\bazframe'
          $installedNative = Join-Path $installed 'artifacts\native\win32-x64-msvc\bazframe-win32.node'
          $installedHash = (Get-FileHash $installedNative -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($installedHash -cne $expectedHash) { throw 'Packed native binary changed.' }
          "source_commit=$env:GITHUB_SHA" >> $env:GITHUB_OUTPUT
          "binary_sha256=$expectedHash" >> $env:GITHUB_OUTPUT
          "tarball_sha256=$tarballHash" >> $env:GITHUB_OUTPUT
          "npm_version=$npmVersion" >> $env:GITHUB_OUTPUT
          $env:npm_config_offline = 'true'
          node ./scripts/run-win32-qualification.mjs --selection foundation `
            --source-root $PWD.Path --installed-root $installed `
            --foundation-source-output (Join-Path $PWD 'native-source-evidence.json') `
            --foundation-installed-output (Join-Path $PWD 'native-installed-evidence.json')
          if ($LASTEXITCODE -ne 0) { throw 'Foundation qualification failed.' }
      - name: Assemble source-bound evidence
        run: |
          $ErrorActionPreference = 'Stop'
          $nodeVersion = node --version
          if ($LASTEXITCODE -ne 0) { throw "Node version inspection failed with exit $LASTEXITCODE" }
          $binarySha256 = if (Test-Path native-binary.sha256) { (Get-Content native-binary.sha256 -Raw).Trim() } else { $null }
          $sourceConformance = if (Test-Path native-source-evidence.json) { Get-Content native-source-evidence.json -Raw | ConvertFrom-Json } else { $null }
          $installedConformance = if (Test-Path native-installed-evidence.json) { Get-Content native-installed-evidence.json -Raw | ConvertFrom-Json } else { $null }
          $completion = if ($null -ne $binarySha256 -and
              $sourceConformance.schemaVersion -eq 7 -and
              $installedConformance.schemaVersion -eq 7 -and
              $sourceConformance.completion -eq 'passed' -and
              $installedConformance.completion -eq 'passed' -and
              $sourceConformance.releaseAdmission -eq 'not-authorized' -and
              $installedConformance.releaseAdmission -eq 'not-authorized' -and
              $sourceConformance.windowsSupportClaim -eq $false -and
              $installedConformance.windowsSupportClaim -eq $false -and
              $sourceConformance.observations.binarySha256 -eq $binarySha256 -and
              $installedConformance.observations.binarySha256 -eq $binarySha256) { 'passed' } else { 'failed' }
          $evidence = [ordered]@{
            schemaVersion = 7
            purpose = 'Bazframe-owned native foundation evidence only; not release admission or a Windows support claim.'
            completion = $completion
            sourceCommit = '${{ github.sha }}'
            runnerImage = $env:ImageOS
            runnerImageVersion = $env:ImageVersion
            node = $nodeVersion
            rust = if (Test-Path native-rust-version.txt) { Get-Content native-rust-version.txt -Raw } else { $null }
            msvcToolsVersion = $env:BAZFRAME_MSVC_TOOLS_VERSION
            msvc = if (Test-Path native-msvc-version.txt) { Get-Content native-msvc-version.txt -Raw } else { $null }
            binarySha256 = $binarySha256
            sourceConformance = $sourceConformance
            installedConformance = $installedConformance
            releaseAdmission = 'not-authorized'
            windowsSupportClaim = $false
          }
          $evidence | ConvertTo-Json -Depth 20 | Set-Content native-foundation-evidence.json
          if ($completion -ne 'passed') { throw 'Native foundation evidence is incomplete or failed.' }

      - name: Verify complete foundation-qualified input before transport
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'win32-qualification/foundation'
          New-Item -ItemType Directory (Join-Path $root 'artifacts/native/win32-x64-msvc') -Force | Out-Null
          Copy-Item artifacts/native/win32-x64-msvc/bazframe-win32.node (Join-Path $root 'artifacts/native/win32-x64-msvc/bazframe-win32.node')
          Copy-Item native-binary.sha256,native-foundation-evidence.json,native-source-evidence.json,native-installed-evidence.json,native-rust-version.txt,native-msvc-version.txt $root
          node ./scripts/win32-qualification-input.mjs foundation
          if ($LASTEXITCODE -ne 0) { throw 'Foundation input verification failed.' }
          $commit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Git revision inspection failed.' }
          $state = & git status --porcelain=v1 --untracked-files=all
          if ($LASTEXITCODE -ne 0) { throw 'Git cleanliness inspection failed.' }
          if ($commit -cne $env:GITHUB_SHA -or -not [string]::IsNullOrWhiteSpace(($state -join "`n"))) {
            throw 'Qualification source changed or is not clean.'
          }
      - name: Transfer foundation-qualified input only (not final success)
        id: upload-input
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bazframe-win32-qualification-input-foundation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: ${{ runner.temp }}/win32-qualification/foundation/
      - name: Upload sanitized failed or cancelled diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bazframe-win32-diagnostics-foundation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            native-source-evidence.json
            native-installed-evidence.json
            native-rust-version.txt
            native-msvc-version.txt

  product-source:
    needs: foundation
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    outputs:
      artifact_id: ${{ steps.upload-input.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-input.outputs.artifact-digest }}
      source_commit: ${{ steps.binding.outputs.source_commit }}
      binary_sha256: ${{ steps.binding.outputs.binary_sha256 }}
      tarball_sha256: ${{ steps.binding.outputs.tarball_sha256 }}
      npm_version: ${{ steps.binding.outputs.npm_version }}
    env:
      FOUNDATION_BINDING: ${{ toJSON(needs.foundation.outputs) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check exact clean source before setup
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Git revision inspection failed.' }
          $state = & git status --porcelain=v1 --untracked-files=all
          if ($LASTEXITCODE -ne 0) { throw 'Git cleanliness inspection failed.' }
          if ($commit -cne $env:GITHUB_SHA -or -not [string]::IsNullOrWhiteSpace(($state -join "`n"))) {
            throw 'Qualification source changed or is not clean.'
          }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Authenticate and verify exact qualified input; stage only verified native bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node ./scripts/win32-qualification-input.mjs consume
          if ($LASTEXITCODE -ne 0) { throw 'Qualified input refused.' }
      - name: Rebuild and require identical whole tarball before product execution
        id: binding
        run: |
          $ErrorActionPreference = 'Stop'
          $binding = $env:FOUNDATION_BINDING | ConvertFrom-Json
          $npmVersion = (npm --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $npmVersion -cne $binding.npm_version) { throw 'npm version differs from producer.' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'TypeScript build failed.' }
          $npmVersion = (npm --version).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'npm version inspection failed.' }
          $pack = npm pack --ignore-scripts --json --silent | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $pack.Count -ne 1) { throw 'Expected exactly one successful Bazframe pack.' }
          $tarball = Join-Path $PWD $pack[0].filename
          $tarballHash = (Get-FileHash $tarball -Algorithm SHA256).Hash.ToLowerInvariant()
          $env:QUALIFICATION_TARBALL = $tarball
          $env:QUALIFICATION_NPM_VERSION = $npmVersion
          node ./scripts/win32-qualification-input.mjs repack
          if ($LASTEXITCODE -ne 0) { throw 'Whole tarball does not match qualified producer.' }
          $expectedHash = $binding.binary_sha256
          "source_commit=$env:GITHUB_SHA" >> $env:GITHUB_OUTPUT
          "binary_sha256=$expectedHash" >> $env:GITHUB_OUTPUT
          "tarball_sha256=$tarballHash" >> $env:GITHUB_OUTPUT
          "npm_version=$npmVersion" >> $env:GITHUB_OUTPUT
      - name: Admit independent private conformance roots
        run: |
          $ErrorActionPreference = 'Stop'
          $testParent = $env:LOCALAPPDATA
          $drive = (Get-Item $testParent).PSDrive.Name
          $disk = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='$($drive):'"
          if ($null -eq $disk -or $disk.DriveType -ne 3 -or $disk.FileSystem -ne 'NTFS') {
            throw 'The private conformance parent is not on a fixed local NTFS volume.'
          }
          $env:BAZFRAME_WIN32_NATIVE_TEST_PARENT = $testParent
          "BAZFRAME_WIN32_NATIVE_TEST_PARENT=$testParent" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Qualify only product-source offline and verify exact single receipt
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'win32-qualification/product'
          New-Item -ItemType Directory $root -Force | Out-Null
          $env:npm_config_offline = 'true'
          node ./scripts/run-win32-qualification.mjs --selection product-source `
            --source-root $PWD.Path `
            --product-source-output (Join-Path $root 'source.json')
          if ($LASTEXITCODE -ne 0) { throw 'Product qualification failed.' }
          node ./scripts/win32-qualification-input.mjs product-source
          if ($LASTEXITCODE -ne 0) { throw 'Product receipt refused.' }
          $commit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Git revision inspection failed.' }
          $state = & git status --porcelain=v1 --untracked-files=all
          if ($LASTEXITCODE -ne 0) { throw 'Git cleanliness inspection failed.' }
          if ($commit -cne $env:GITHUB_SHA -or -not [string]::IsNullOrWhiteSpace(($state -join "`n"))) {
            throw 'Qualification source changed or is not clean.'
          }
      - name: Transfer verified product input only
        id: upload-input
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bazframe-win32-qualification-input-product-source-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: ${{ runner.temp }}/win32-qualification/product/source.json
      - name: Upload sanitized failed or cancelled diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bazframe-win32-diagnostics-product-source-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/win32-qualification/product/source.json

  product-installed:
    needs: foundation
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    outputs:
      artifact_id: ${{ steps.upload-input.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-input.outputs.artifact-digest }}
      source_commit: ${{ steps.binding.outputs.source_commit }}
      binary_sha256: ${{ steps.binding.outputs.binary_sha256 }}
      tarball_sha256: ${{ steps.binding.outputs.tarball_sha256 }}
      npm_version: ${{ steps.binding.outputs.npm_version }}
    env:
      FOUNDATION_BINDING: ${{ toJSON(needs.foundation.outputs) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check exact clean source before setup
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Git revision inspection failed.' }
          $state = & git status --porcelain=v1 --untracked-files=all
          if ($LASTEXITCODE -ne 0) { throw 'Git cleanliness inspection failed.' }
          if ($commit -cne $env:GITHUB_SHA -or -not [string]::IsNullOrWhiteSpace(($state -join "`n"))) {
            throw 'Qualification source changed or is not clean.'
          }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Authenticate and verify exact qualified input; stage only verified native bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node ./scripts/win32-qualification-input.mjs consume
          if ($LASTEXITCODE -ne 0) { throw 'Qualified input refused.' }
      - name: Rebuild and require identical whole tarball before product execution
        id: binding
        run: |
          $ErrorActionPreference = 'Stop'
          $binding = $env:FOUNDATION_BINDING | ConvertFrom-Json
          $npmVersion = (npm --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $npmVersion -cne $binding.npm_version) { throw 'npm version differs from producer.' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'TypeScript build failed.' }
          $npmVersion = (npm --version).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'npm version inspection failed.' }
          $pack = npm pack --ignore-scripts --json --silent | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $pack.Count -ne 1) { throw 'Expected exactly one successful Bazframe pack.' }
          $tarball = Join-Path $PWD $pack[0].filename
          $tarballHash = (Get-FileHash $tarball -Algorithm SHA256).Hash.ToLowerInvariant()
          $env:QUALIFICATION_TARBALL = $tarball
          $env:QUALIFICATION_NPM_VERSION = $npmVersion
          node ./scripts/win32-qualification-input.mjs repack
          if ($LASTEXITCODE -ne 0) { throw 'Whole tarball does not match qualified producer.' }
          $expectedHash = $binding.binary_sha256
          $installRoot = Join-Path $env:RUNNER_TEMP 'bazframe-native-packed-install'
          New-Item -ItemType Directory $installRoot | Out-Null
          npm install --prefix $installRoot --ignore-scripts --no-package-lock $tarball
          if ($LASTEXITCODE -ne 0) { throw 'Packed npm install failed.' }
          $installed = Join-Path $installRoot 'node_modules\bazframe'
          $installedNative = Join-Path $installed 'artifacts\native\win32-x64-msvc\bazframe-win32.node'
          $installedHash = (Get-FileHash $installedNative -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($installedHash -cne $expectedHash) { throw 'Packed native binary changed.' }
          "source_commit=$env:GITHUB_SHA" >> $env:GITHUB_OUTPUT
          "binary_sha256=$expectedHash" >> $env:GITHUB_OUTPUT
          "tarball_sha256=$tarballHash" >> $env:GITHUB_OUTPUT
          "npm_version=$npmVersion" >> $env:GITHUB_OUTPUT
          "QUALIFICATION_INSTALLED=$installed" >> $env:GITHUB_ENV
      - name: Admit independent private conformance roots
        run: |
          $ErrorActionPreference = 'Stop'
          $testParent = $env:LOCALAPPDATA
          $drive = (Get-Item $testParent).PSDrive.Name
          $disk = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='$($drive):'"
          if ($null -eq $disk -or $disk.DriveType -ne 3 -or $disk.FileSystem -ne 'NTFS') {
            throw 'The private conformance parent is not on a fixed local NTFS volume.'
          }
          $env:BAZFRAME_WIN32_NATIVE_TEST_PARENT = $testParent
          "BAZFRAME_WIN32_NATIVE_TEST_PARENT=$testParent" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Qualify only product-installed offline and verify exact single receipt
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'win32-qualification/product'
          New-Item -ItemType Directory $root -Force | Out-Null
          $env:npm_config_offline = 'true'
          node ./scripts/run-win32-qualification.mjs --selection product-installed `
            --source-root $PWD.Path `
            --installed-root $env:QUALIFICATION_INSTALLED `
            --product-installed-output (Join-Path $root 'installed.json')
          if ($LASTEXITCODE -ne 0) { throw 'Product qualification failed.' }
          node ./scripts/win32-qualification-input.mjs product-installed
          if ($LASTEXITCODE -ne 0) { throw 'Product receipt refused.' }
          $commit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Git revision inspection failed.' }
          $state = & git status --porcelain=v1 --untracked-files=all
          if ($LASTEXITCODE -ne 0) { throw 'Git cleanliness inspection failed.' }
          if ($commit -cne $env:GITHUB_SHA -or -not [string]::IsNullOrWhiteSpace(($state -join "`n"))) {
            throw 'Qualification source changed or is not clean.'
          }
      - name: Transfer verified product input only
        id: upload-input
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bazframe-win32-qualification-input-product-installed-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: ${{ runner.temp }}/win32-qualification/product/installed.json
      - name: Upload sanitized failed or cancelled diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bazframe-win32-diagnostics-product-installed-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/win32-qualification/product/installed.json

  promote:
    needs: [foundation, product-source, product-installed]
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    # No always()/failure fallback: every qualification job must have succeeded.
    outputs:
      artifact_id: ${{ steps.upload-success.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-success.outputs.artifact-digest }}
    env:
      FOUNDATION_BINDING: ${{ toJSON(needs.foundation.outputs) }}
      SOURCE_BINDING: ${{ toJSON(needs.product-source.outputs) }}
      INSTALLED_BINDING: ${{ toJSON(needs.product-installed.outputs) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check exact clean source before setup
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Git revision inspection failed.' }
          $state = & git status --porcelain=v1 --untracked-files=all
          if ($LASTEXITCODE -ne 0) { throw 'Git cleanliness inspection failed.' }
          if ($commit -cne $env:GITHUB_SHA -or -not [string]::IsNullOrWhiteSpace(($state -join "`n"))) {
            throw 'Qualification source changed or is not clean.'
          }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Reauthenticate all inputs and promote only original verified bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          node ./scripts/win32-qualification-input.mjs promote
          if ($LASTEXITCODE -ne 0) { throw 'Final qualification promotion refused.' }
          $commit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Git revision inspection failed.' }
          $state = & git status --porcelain=v1 --untracked-files=all
          if ($LASTEXITCODE -ne 0) { throw 'Git cleanliness inspection failed.' }
          if ($commit -cne $env:GITHUB_SHA -or -not [string]::IsNullOrWhiteSpace(($state -join "`n"))) {
            throw 'Qualification source changed or is not clean.'
          }
      - name: Upload successful internal product-slice evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bazframe-win32-added-skill-product-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/win32-qualification/product/source.json
            ${{ runner.temp }}/win32-qualification/product/installed.json
      - name: Upload successful binary and evidence
        id: upload-success
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bazframe-win32-native-foundation-${{ github.sha }}
          if-no-files-found: error
          path: ${{ runner.temp }}/win32-qualification/foundation/
      - name: Upload sanitized failed or cancelled diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bazframe-win32-diagnostics-promotion-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/win32-qualification/product/source.json
            ${{ runner.temp }}/win32-qualification/product/installed.json
