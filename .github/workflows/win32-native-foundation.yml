    outputs:
      artifact_id:
        description: Numeric ID of the successful foundation artifact.
        value: ${{ jobs.promote.outputs.artifact_id }}
      artifact_digest:
        description: Raw lowercase 64-hex SHA-256 output from actions/upload-artifact.
        value: ${{ jobs.promote.outputs.artifact_digest }}
