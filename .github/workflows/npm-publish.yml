name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1
          cache: npm
      - name: Verify release toolchain
        run: |
          test "$(node --version)" = "v24.14.1"
          test "$(npm --version)" = "11.11.0"
      - name: Verify release identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          if (`v${manifest.version}` !== process.env.RELEASE_TAG) {
            throw new Error(`Tag ${process.env.RELEASE_TAG} does not match v${manifest.version}.`);
          }
          if (manifest.private === true) {
            throw new Error('Remove package.json private:true only after the license choice is recorded.');
          }
          if (typeof manifest.license !== 'string' || manifest.license.length === 0) {
            throw new Error('An explicit public-package license choice is required before publishing.');
          }
          if (manifest.license !== 'UNLICENSED' && !existsSync('LICENSE')) {
            throw new Error('A non-UNLICENSED package requires a root LICENSE file.');
          }
          if (manifest.publishConfig?.access !== 'public' || manifest.publishConfig?.tag !== 'next') {
            throw new Error('The npm beta must publish publicly with the next dist-tag.');
          }
          NODE
      - name: Require an existing npm package
        run: npm view bazframe name >/dev/null
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev
      - name: Pack and checksum the reviewed bytes
        id: pack
        run: |
          npm pack --json > npm-pack.json
          TARBALL="$(node --input-type=module -e "import{readFileSync}from'node:fs';const value=JSON.parse(readFileSync('npm-pack.json','utf8'));if(value.length!==1)throw new Error('Expected one tarball.');process.stdout.write(value[0].filename)")"
          case "$TARBALL" in
            *.tgz) ;;
            *) echo "Unexpected tarball path: $TARBALL" >&2; exit 1 ;;
          esac
          test -f "$TARBALL"
          sha256sum "$TARBALL" > "$TARBALL.sha256"
          printf 'tarball=%s\n' "$TARBALL" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: |
            ${{ steps.pack.outputs.tarball }}
            ${{ steps.pack.outputs.tarball }}.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1
          registry-url: https://registry.npmjs.org
      - name: Verify release toolchain
        run: |
          test "$(node --version)" = "v24.14.1"
          test "$(npm --version)" = "11.11.0"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package
          path: release
      - name: Verify and publish the exact tarball
        run: |
          mapfile -t TARBALLS < <(find release -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#TARBALLS[@]}" -eq 1
          (cd release && sha256sum --check "$(basename "${TARBALLS[0]}").sha256")
          npm publish "${TARBALLS[0]}" --access public --tag next
